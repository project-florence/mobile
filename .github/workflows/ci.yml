name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: gradle

      - name: Run unit tests
        run: ./gradlew :app:testDevDebugUnitTest --console=plain

      - name: Assemble dev debug APK
        run: ./gradlew :app:assembleDevDebug --console=plain

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: gradle

      - name: Run lint (devDebug)
        run: ./gradlew :app:lintDevDebug --console=plain

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn

  release:
    name: Release (unsigned APK artifact)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: gradle

      # Build dev + prod, debug + release. Release APKs are intentionally
      # UNsigned (buildType release has no signingConfig; the keystore is NOT
      # checked in and no secrets are used here). The developer signs them
      # out-of-band with apksigner — see docs/release-signing.md.
      - name: Assemble all APK variants
        run: |
          ./gradlew \
            :app:assembleProdRelease \
            :app:assembleProdDebug \
            :app:assembleDevRelease \
            :app:assembleDevDebug \
            --console=plain

      # Upload every produced APK as a single artifact for manual download/signing.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: florence-apks
          path: app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error