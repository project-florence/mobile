name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: gradle

      # gradle.properties on this repo pins org.gradle.java.home to a Windows path.
      # Comment that line out for the Linux runner (ephemeral checkout, repo untouched).
      - name: Comment out Windows-only JDK path in gradle.properties
        run: |
          sed -i 's|^org\.gradle\.java\.home=.*|#&|' gradle.properties

      - name: Run unit tests
        run: ./gradlew :app:testDevDebugUnitTest --console=plain

      - name: Assemble dev debug APK
        run: ./gradlew :app:assembleDevDebug --console=plain

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: gradle

      # Same Windows JDK path override as in the test job (issue only affects Linux runners).
      - name: Comment out Windows-only JDK path in gradle.properties
        run: |
          sed -i 's|^org\.gradle\.java\.home=.*|#&|' gradle.properties

      - name: Run lint (devDebug)
        run: ./gradlew :app:lintDevDebug --console=plain

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn

  release:
    name: Release (unsigned APK artifact)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache: gradle

      - name: Comment out Windows-only JDK path in gradle.properties
        run: |
          sed -i 's|^org\.gradle\.java\.home=.*|#&|' gradle.properties

      - name: Assemble prod release APK
        run: ./gradlew :app:assembleProdRelease --console=plain

      # Unsigned APK — uploaded as a build artifact, NOT published as a release.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: florence-prod-release-apk
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error