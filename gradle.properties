# Florence Mobile — Gradle properties
# NOTE: the JDK is resolved from the JAVA_HOME environment variable; no
# machine-specific org.gradle.java.home path is pinned here, so the build is
# portable across machines and CI. Use a JDK 17+ (JBR 21 works).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
